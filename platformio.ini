; Battery monitor: one codebase, two targets.
;   pio run -e simulator -t exec          -> 480x480 window on your computer (needs SDL2)
;   pio run -e esp32-4848S040CIY1 -t upload -t monitor   -> flash the Guition board

[platformio]
default_envs = simulator
boards_dir = boards

[common]
lvgl = lvgl/lvgl@9.6.0
arduinojson = bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
build_unflags = -std=gnu++11

[env:simulator]
platform = native
build_src_filter = +<core/> +<ui/> +<platform/sim/>
lib_deps =
    ${common.lvgl}
    ${common.arduinojson}
build_flags =
    ${common.build_flags}
    -D SIMULATOR=1
    !sdl2-config --cflags --libs
    -lpthread
build_unflags = ${common.build_unflags}

[env:esp32-4848S040CIY1]
platform = espressif32@7.1.3  ; 8.x moved to Arduino 3.x, which esp32-smartdisplay does not support yet
board = esp32-4848S040CIY1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<core/> +<ui/> +<platform/esp32/>
lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git#38e9ebabe3e4044159c4e95192d432607ed70588
    ${common.lvgl}
    ${common.arduinojson}
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    ${common.build_flags}
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_MAJOR=1'
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_MINOR=0'
    '-D ESP_LCD_PANEL_IO_ADDITIONS_VER_PATCH=1'
build_unflags = ${common.build_unflags}
